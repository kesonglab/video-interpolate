name: Test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest  # 因为测试依赖 ffmpeg/ffprobe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: make build